<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showtime Flag Football League</title>

    <!-- The app-wide font (see FontContext) is a local serif by default, so no
       webfont is fetched here. Non-default choices load their stylesheet on
       demand instead of shipping all ten families to every visitor. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta
      name="description"
      content="Stats, fixtures, standings and stories from the Showtime Flag Football League — Nigeria's premier flag football competition."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage, Slack, Discord, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Showtime Flag Football League" />
    <meta property="og:title" content="Showtime Flag Football League" />
    <meta
      property="og:description"
      content="Stats, fixtures, standings and stories from Nigeria's premier flag football league."
    />
    <meta property="og:url" content="https://www.showtimeflag.football/" />
    <meta
      property="og:image"
      content="https://www.showtimeflag.football/og-image-2.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="780" />
    <meta property="og:image:alt" content="Showtime Flag Football League" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showtime Flag Football League" />
    <meta
      name="twitter:description"
      content="Stats, fixtures, standings and stories from Nigeria's premier flag football league."
    />
    <meta
      name="twitter:image"
      content="https://www.showtimeflag.football/og-image-2.png"
    />
    <meta name="twitter:image:alt" content="Showtime Flag Football League" />

    <meta name="theme-color" content="#0a1f44" />

    <!-- Google AdSense site verification + loader. Static in the HTML (not
       injected by React) so Google's crawler sees it on the raw page, and
       independent of VITE_ADS_ENABLED so verification can't be blocked by an
       env mistake. The loader alone shows nothing until Auto ads are switched
       on in the AdSense dashboard or a <GoogleAd /> unit is placed. -->
    <meta name="google-adsense-account" content="ca-pub-9532897572424396" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9532897572424396"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
