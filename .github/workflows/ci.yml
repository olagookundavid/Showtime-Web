name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      # The Swagger `docs` package is generated (gitignored), so it must be
      # produced before `go build`, exactly as the Dockerfile does.
      - name: Install swag (Swagger generator)
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate Swagger docs
        working-directory: backend
        run: swag init -g cmd/main/main.go
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
