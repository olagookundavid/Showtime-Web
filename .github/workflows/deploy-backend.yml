name: Build & Push Backend Image

# Builds the backend Docker image on every push to main and publishes it to
# GitHub Container Registry (ghcr.io). The server then pulls this image.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pkg-common/**"
      - "go.work"
      - "go.work.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/showtime-backend

jobs:
  test:
    name: Test backend before building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      # Swagger docs are generated + gitignored — must exist before `go build`/`go vet`.
      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate Swagger docs
        working-directory: backend
        run: swag init -g cmd/main/main.go
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...

  build-and-push:
    needs: test # invalid code (fails vet/tests) never gets built into an image
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the code
      packages: write # to push the image to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64 # matches the Contabo server's architecture
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push # only deploy if the image built & pushed successfully
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server's forced command runs the real deploy; this script is
          # ignored by SSH. The pull+up+prune happens server-side.
          script: "deploy"
