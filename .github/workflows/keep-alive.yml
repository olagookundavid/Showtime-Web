name: Keep Alive

on:
  schedule:
    - cron: "*/50 * * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Koyeb Healthcheck
        run: curl -s -o /dev/null -w "%{http_code}" https://exclusive-johnette-davidoh-525a86c7.koyeb.app/api/v1/healthcheck
