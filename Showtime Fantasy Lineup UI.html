<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showtime Fantasy Lineup UI</title>
<style>body{margin:0;padding:24px 12px;background:#e9edf2} @media(max-width:560px){body{padding:8px}}</style>
</head>
<body>
<div id="showtime-lineup">
  <style>
    #showtime-lineup{--navy:#0d1e38;--navy2:#142c50;--red:#ed4937;--cream:#f7f3e9;--field:#194b3b;--field2:#164535;--lime:#c9e7c9;--white:#fff;max-width:790px;margin:0 auto;font-family:Inter,Arial,sans-serif;color:var(--cream)}
    #showtime-lineup *{box-sizing:border-box}
    #showtime-lineup .shell{background:var(--navy);border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #0003;border:1px solid #ffffff22}
    #showtime-lineup .top{display:flex;align-items:center;gap:14px;padding:18px 24px;background:linear-gradient(115deg,#102447,#07162b);border-bottom:1px solid #ffffff25}
    #showtime-lineup .brand{width:58px;height:58px;object-fit:contain;flex:none}
    #showtime-lineup .title{min-width:0;flex:1}
    #showtime-lineup .eyebrow{color:#91a6c7;letter-spacing:.16em;font-size:11px;font-weight:700;text-transform:uppercase}
    #showtime-lineup h2{margin:3px 0 0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:.005em}
    #showtime-lineup .count{text-align:right;white-space:nowrap;font-size:11px;color:#aebdd0;text-transform:uppercase;letter-spacing:.1em}
    #showtime-lineup .count strong{display:block;color:white;font-size:25px;letter-spacing:0;line-height:1.15}
    #showtime-lineup .key{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 24px;background:#102746;font-size:12px;color:#dbe5f1}
    #showtime-lineup .keypart{display:flex;gap:8px;align-items:center;white-space:nowrap}
    #showtime-lineup .dot{height:9px;width:9px;border-radius:50%;background:var(--red)}
    #showtime-lineup .dot.def{background:#7fbbfa}
    #showtime-lineup .field-wrap{padding:12px;background:#102746}
    #showtime-lineup .field{position:relative;height:670px;overflow:hidden;border:2px solid #d1ebd15c;border-radius:13px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(20% - 2px),#e3f6d222 calc(20% - 1px),#e3f6d222 20%),repeating-linear-gradient(to bottom,var(--field) 0,var(--field) 20%,var(--field2) 20%,var(--field2) 40%);box-shadow:inset 0 0 65px #06180e66}
    #showtime-lineup .field:before,#showtime-lineup .field:after{content:"";position:absolute;left:4%;right:4%;height:1px;background:#d8efd55c;pointer-events:none}
    #showtime-lineup .field:before{top:12%}#showtime-lineup .field:after{bottom:12%}
    #showtime-lineup .side{position:absolute;top:15%;bottom:15%;width:1px;background:#d8efd545;z-index:0}#showtime-lineup .side.left{left:4%}#showtime-lineup .side.right{right:4%}
    #showtime-lineup .endzone{position:absolute;left:0;right:0;height:12%;display:flex;justify-content:center;align-items:center;color:#ffffff2c;font-size:clamp(20px,5vw,39px);font-weight:900;letter-spacing:.24em;font-style:italic;pointer-events:none}
    #showtime-lineup .endzone.top{top:0;background:#102d2bb0;border-bottom:1px solid #e8f5e054}#showtime-lineup .endzone.bottom{bottom:0;background:#102d2bb0;border-top:1px solid #e8f5e054}
    #showtime-lineup .yard{position:absolute;left:5.7%;color:#e8f3df70;font-size:12px;font-weight:800;letter-spacing:.08em}#showtime-lineup .yard.y1{top:21%}#showtime-lineup .yard.y2{top:76%}
    #showtime-lineup .scrimmage{position:absolute;left:3%;right:3%;top:51%;height:0;border-top:2px dashed #efede6ac;z-index:1}
    #showtime-lineup .loslabel{position:absolute;top:51%;right:5%;transform:translateY(-50%);background:#f5f1e8;color:#123b31;border-radius:3px;padding:4px 6px;font-size:10px;letter-spacing:.12em;font-weight:900;z-index:2}
    #showtime-lineup .unitlabel{position:absolute;left:5.5%;font-size:11px;font-weight:900;letter-spacing:.18em;color:#dcf0dfad;pointer-events:none}#showtime-lineup .unitlabel.defense{top:13%}#showtime-lineup .unitlabel.offense{top:53%}
    #showtime-lineup .player{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 1px;background:none;border:0;color:white;width:82px;cursor:pointer;z-index:3;font:inherit;transition:transform .16s ease,filter .16s ease}
    #showtime-lineup .player:hover,#showtime-lineup .player:focus-visible{transform:translate(-50%,-55%);filter:brightness(1.15);outline:none}
    #showtime-lineup .player.active .avatar{box-shadow:0 0 0 3px #fff,0 0 0 6px #f9d16b,0 6px 16px #071c17aa}
    #showtime-lineup .avatar{position:relative;display:block;width:50px;height:50px;border-radius:50%;border:2px solid #ffffffbd;background:linear-gradient(150deg,#f46750,#b72f32);box-shadow:0 5px 13px #051a13a8;overflow:hidden}
    #showtime-lineup .player.def .avatar{background:linear-gradient(150deg,#99cafa,#37699f)}
    #showtime-lineup .avatar:before{content:"";position:absolute;top:9px;left:18px;width:11px;height:12px;border-radius:50%;background:#fff}
    #showtime-lineup .avatar:after{content:"";position:absolute;bottom:4px;left:10px;width:28px;height:20px;border-radius:16px 16px 8px 8px;background:#fff}
    #showtime-lineup .role{display:block;min-width:34px;padding:3px 5px;border-radius:4px;background:#f8f4e9;color:#10263e;font-weight:900;font-size:11px;line-height:1;text-align:center;box-shadow:0 2px 5px #071a1866}
    #showtime-lineup .def .role{background:#c4dfff}
    #showtime-lineup .details{min-height:57px;display:flex;align-items:center;gap:13px;padding:13px 23px;border-top:1px solid #ffffff24;background:#0c203a}
    #showtime-lineup .detail-badge{display:flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 5px;border-radius:5px;background:var(--red);font-size:12px;font-weight:900}
    #showtime-lineup .detail-badge.def{background:#7fbbfa;color:#0d2440}
    #showtime-lineup .details strong{display:block;font-size:14px}
    #showtime-lineup .details small{display:block;margin-top:2px;font-size:11px;color:#afc1d4}
    @media(max-width:560px){#showtime-lineup .top{padding:13px 14px;gap:9px}#showtime-lineup .brand{width:45px;height:45px}#showtime-lineup h2{font-size:17px}#showtime-lineup .count strong{font-size:20px}#showtime-lineup .key{padding:10px 14px;font-size:11px}#showtime-lineup .field-wrap{padding:7px}#showtime-lineup .field{height:630px}#showtime-lineup .player{width:55px}#showtime-lineup .avatar{height:39px;width:39px}#showtime-lineup .avatar:before{left:14px;top:7px;width:9px;height:10px}#showtime-lineup .avatar:after{left:7px;bottom:3px;width:22px;height:16px}#showtime-lineup .role{font-size:11px;padding:2px 3px;min-width:28px}#showtime-lineup .unitlabel{font-size:10px;letter-spacing:.1em}#showtime-lineup .yard{display:none}#showtime-lineup .loslabel{right:3%;font-size:9px}#showtime-lineup .details{padding:12px 14px}}
  </style>

    (()=>{const root=document.getElementById('showtime-lineup');const detail=root.querySelector('.details');root.querySelectorAll('.player').forEach(button=>button.addEventListener('click',()=>{root.querySelectorAll('.player').forEach(p=>{p.classList.remove('active');p.removeAttribute('aria-pressed')});button.classList.add('active');button.setAttribute('aria-pressed','true');detail.innerHTML='<span class="detail-badge'+(button.classList.contains('def')?' def':'')+'">'+button.dataset.code+'</span><div><strong>'+button.dataset.role+'</strong><small>Select a position to view its player</small></div>'}));})();
  </script>
</div>

</body>
