&lt;div id=&quot;sf-match-summary&quot; class=&quot;viz-dotted-background&quot;&gt;
  &lt;style&gt;
    #sf-match-summary{--sf-navy:#07182e;--sf-navy-2:#0e2747;--sf-navy-3:#16355d;--sf-red:#ef4638;--sf-blue:#78baff;--sf-cream:#f7f4ec;--sf-muted:#9fb1c8;--sf-line:#ffffff1f;--sf-green:#4fce8a;padding:18px;font-family:Inter,Arial,sans-serif;color:var(--sf-cream)}
    #sf-match-summary *{box-sizing:border-box}
    #sf-match-summary .app{max-width:920px;margin:auto;background:var(--sf-navy);border-radius:22px;overflow:hidden;box-shadow:0 24px 55px #0004}
    #sf-match-summary .appbar{display:flex;align-items:center;gap:13px;padding:16px 22px;background:linear-gradient(115deg,#10294c,#07162b);border-bottom:1px solid var(--sf-line)}
    #sf-match-summary .logo{width:50px;height:50px;object-fit:contain;flex:none}
    #sf-match-summary .brand{flex:1;min-width:0}
    #sf-match-summary .brand-label{color:#8fa6c3;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    #sf-match-summary .brand-title{margin-top:3px;font-size:19px;font-weight:800}
    #sf-match-summary .final{padding:6px 9px;border-radius:5px;background:var(--sf-green);color:#08281a;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
    #sf-match-summary .scoreboard{padding:23px 22px 18px;background:radial-gradient(circle at 50% 0,#173b65 0,#0b2340 43%,#07182e 100%)}
    #sf-match-summary .meta{text-align:center;color:#9fb2ca;font-size:12px;letter-spacing:.04em}
    #sf-match-summary .score-row{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:16px;align-items:center;margin-top:17px}
    #sf-match-summary .team{display:flex;align-items:center;gap:12px;min-width:0}
    #sf-match-summary .team.away{flex-direction:row-reverse;text-align:right}
    #sf-match-summary .crest{display:grid;place-items:center;width:58px;height:58px;flex:none;border-radius:16px;background:linear-gradient(145deg,#1e497b,#0f2c50);border:1px solid #ffffff29;color:white;font-size:19px;font-weight:900}
    #sf-match-summary .team.away .crest{background:linear-gradient(145deg,#f15c4c,#a9232b)}
    #sf-match-summary .team-name{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #sf-match-summary .record{margin-top:3px;color:#91a5be;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    #sf-match-summary .score{text-align:center;font-size:47px;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
    #sf-match-summary .score span{color:#7086a1;padding:0 5px}
    #sf-match-summary .periods{display:grid;grid-template-columns:1fr repeat(3,54px);max-width:440px;margin:20px auto 0;border-top:1px solid var(--sf-line);border-bottom:1px solid var(--sf-line)}
    #sf-match-summary .periods div{padding:8px 7px;text-align:center;font-size:12px;color:#adbed1}
    #sf-match-summary .periods .pteam{text-align:left;color:white;font-weight:700}
    #sf-match-summary .periods .total{color:white;font-weight:900}
    #sf-match-summary .tabs{display:flex;gap:6px;padding:12px 18px;background:#0b203b;border-bottom:1px solid var(--sf-line)}
    #sf-match-summary .tab{appearance:none;border:0;border-radius:7px;padding:9px 13px;background:transparent;color:#9fb2ca;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
    #sf-match-summary .tab[aria-selected=&quot;true&quot;]{background:var(--sf-cream);color:#0a1f39}
    #sf-match-summary .panel{padding:20px 22px 24px;background:#0a1d35}
    #sf-match-summary .panel[hidden]{display:none}
    #sf-match-summary .section-title{margin:0 0 13px;font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#9fb3cc}
    #sf-match-summary .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}
    #sf-match-summary .mvp{display:flex;align-items:center;gap:14px;padding:15px;background:#102a4b;border:1px solid var(--sf-line);border-radius:13px}
    #sf-match-summary .mvp-avatar{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#f76654,#b92830);color:white;font-size:14px;font-weight:900;border:2px solid #ffffffc7;flex:none}
    #sf-match-summary .mvp-copy{min-width:0;flex:1}
    #sf-match-summary .mvp-tag{color:#f6b44d;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    #sf-match-summary .mvp-name{margin-top:3px;font-size:16px;font-weight:900}
    #sf-match-summary .mvp-stats{margin-top:4px;color:#aec0d4;font-size:11px}
    #sf-match-summary .fantasy{text-align:right}
    #sf-match-summary .fantasy strong{display:block;color:#f8d178;font-size:23px}
    #sf-match-summary .fantasy small{font-size:10px;color:#9fb2c9;text-transform:uppercase}
    #sf-match-summary .leaders{display:grid;gap:8px}
    #sf-match-summary .leader{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff15}
    #sf-match-summary .leader:last-child{border-bottom:0}
    #sf-match-summary .leader-rank{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#17385f;color:#bcd4ed;font-size:11px;font-weight:900}
    #sf-match-summary .leader-name{font-size:12px;font-weight:900}
    #sf-match-summary .leader-meta{margin-top:2px;color:#8fa5bf;font-size:10px}
    #sf-match-summary .leader-value{text-align:right;font-size:13px;font-weight:900;color:#f8d178}
    #sf-match-summary .leader-value small{display:block;margin-top:2px;color:#8298b2;font-size:9px;text-transform:uppercase}
    #sf-match-summary .stats{display:grid;gap:9px}
    #sf-match-summary .stat-line{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:9px}
    #sf-match-summary .stat-value{font-size:12px;font-weight:900;text-align:center}
    #sf-match-summary .stat-center{min-width:0}
    #sf-match-summary .stat-name{text-align:center;color:#a8bad0;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
    #sf-match-summary .bar{display:flex;height:5px;margin-top:4px;background:#25405d;border-radius:5px;overflow:hidden}
    #sf-match-summary .bar .home{background:var(--sf-blue);width:var(--home)}
    #sf-match-summary .bar .away{background:var(--sf-red);flex:1}
    #sf-match-summary .team-stats-head{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;margin-bottom:12px}
    #sf-match-summary .team-stats-head .left,#sf-match-summary .team-stats-head .right{font-size:12px;font-weight:900}
    #sf-match-summary .team-stats-head .right{text-align:right}
    #sf-match-summary .team-stats-head .middle{text-align:center;color:#8197b0;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    #sf-match-summary .stat-groups{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    #sf-match-summary .stat-group{min-width:0}
    #sf-match-summary .stat-group-title{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#9fb4cc;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    #sf-match-summary .stat-group-title:after{content:&quot;&quot;;height:1px;flex:1;background:#ffffff20}
    #sf-match-summary .compare-row{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;min-height:43px;border-bottom:1px solid #ffffff10}
    #sf-match-summary .compare-value{font-size:12px;font-weight:900;text-align:center}
    #sf-match-summary .compare-label{text-align:center;color:#b4c3d5;font-size:11px}
    #sf-match-summary .compare-bar{display:flex;height:4px;margin-top:5px;background:#2a405b;border-radius:6px;overflow:hidden}
    #sf-match-summary .compare-bar .h{width:var(--h);background:var(--sf-blue)}
    #sf-match-summary .compare-bar .a{flex:1;background:var(--sf-red)}
    #sf-match-summary .discipline-note{display:flex;gap:8px;align-items:flex-start;margin-top:13px;padding:11px 12px;background:#301f29;border-left:3px solid #e85b55;color:#d5c1c5;font-size:11px;line-height:1.45}
    #sf-match-summary .divider{height:1px;margin:20px 0;background:var(--sf-line)}
    #sf-match-summary .timeline{display:grid;gap:0}
    #sf-match-summary .event{display:grid;grid-template-columns:60px 15px 1fr 42px;gap:9px;align-items:start;min-height:54px}
    #sf-match-summary .clock{padding-top:1px;text-align:right;color:#93a9c2;font-size:11px;font-weight:800}
    #sf-match-summary .track{position:relative;height:100%}
    #sf-match-summary .track:after{content:&quot;&quot;;position:absolute;top:9px;bottom:-8px;left:7px;width:1px;background:#ffffff2b}
    #sf-match-summary .event:last-child .track:after{display:none}
    #sf-match-summary .node{position:absolute;top:3px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--event-color);box-shadow:0 0 0 3px #0a1d35}
    #sf-match-summary .event-title{font-size:12px;font-weight:800}
    #sf-match-summary .event-detail{margin-top:3px;color:#9fb2c8;font-size:11px}
    #sf-match-summary .running-score{text-align:right;font-size:12px;font-weight:900;color:white}
    #sf-match-summary table{width:100%;border-collapse:collapse;font-size:12px}
    #sf-match-summary th{padding:8px 7px;color:#90a5be;font-size:10px;text-align:left;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--sf-line)}
    #sf-match-summary td{padding:11px 7px;border-bottom:1px solid #ffffff12}
    #sf-match-summary th:not(:first-child),#sf-match-summary td:not(:first-child){text-align:right}
    #sf-match-summary .player-name{font-weight:800}
    #sf-match-summary .player-role{display:block;margin-top:2px;color:#8398b1;font-size:10px}
    #sf-match-summary .fp{color:#f8d178;font-weight:900}
    #sf-match-summary .play-team{display:inline-block;min-width:31px;margin-right:7px;padding:3px 4px;border-radius:4px;background:#1b4776;color:white;text-align:center;font-size:9px;font-weight:900}
    #sf-match-summary .play-team.la{background:#c73736}
    @media(max-width:650px){#sf-match-summary{padding:7px}#sf-match-summary .app{border-radius:14px}#sf-match-summary .appbar{padding:13px 14px}#sf-match-summary .logo{width:42px;height:42px}#sf-match-summary .scoreboard{padding:19px 12px 15px}#sf-match-summary .score-row{grid-template-columns:minmax(0,1fr) 74px minmax(0,1fr);gap:7px}#sf-match-summary .team,#sf-match-summary .team.away{flex-direction:column;text-align:center;gap:7px}#sf-match-summary .crest{width:48px;height:48px;border-radius:13px;font-size:16px}#sf-match-summary .team-name{font-size:13px;white-space:normal}#sf-match-summary .record{font-size:9px}#sf-match-summary .score{font-size:34px}#sf-match-summary .periods{grid-template-columns:1fr repeat(3,44px)}#sf-match-summary .tabs{padding:9px 10px}#sf-match-summary .tab{padding:8px 9px;font-size:11px}#sf-match-summary .panel{padding:17px 13px 20px}#sf-match-summary .hero-grid{grid-template-columns:1fr;gap:18px}#sf-match-summary .mvp{padding:12px}#sf-match-summary .stat-groups{grid-template-columns:1fr;gap:18px}#sf-match-summary .team-stats-head{grid-template-columns:85px 1fr 85px}#sf-match-summary .event{grid-template-columns:50px 14px 1fr 37px;gap:6px}#sf-match-summary th,#sf-match-summary td{padding-left:4px;padding-right:4px}#sf-match-summary .optional{display:none}}
  &lt;/style&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;

    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

    storage = null;

    widgetState: state,

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;

      if (!Number.isSafeInteger(data.id) || data.id <= 0) {

          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));

      }

        typeof height === "number" &&
        Number.isFinite(height) &&

      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

})();
